name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dashboard UI tests (API mocked in the browser)
        run: |
          pnpm --filter @selfhost/web exec playwright install --with-deps chromium
          pnpm --filter @selfhost/web e2e
      - name: Agent bundle answers requests in dry-run mode
        run: |
          node apps/agent/dist/agent.cjs --dry-run --socket /tmp/agent.sock &
          sleep 1
          node test/vm/check-agent.mjs /tmp/agent.sock --dry-run
      - name: selfhost command talks to the dry-run agent
        run: |
          node apps/agent/dist/agent.cjs --dry-run --socket /tmp/agent2.sock &
          sleep 1
          export SELFHOST_AGENT_SOCKET=/tmp/agent2.sock
          node deploy/selfhost-cli.mjs install jellyfin
          node deploy/selfhost-cli.mjs logs jellyfin --tail 5
          node deploy/selfhost-cli.mjs status

  # Runs on a real Ubuntu 24.04 machine with systemd and Docker, so it also covers the M0 exit gate.
  agent-gate:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the agent as a systemd service and check it
        run: |
          mkdir /tmp/gate
          cp apps/agent/dist/agent.cjs deploy/selfhost-agent.service test/vm/check-agent.mjs /tmp/gate/
          sudo bash test/vm/m0-gate-inner.sh /tmp/gate

  # M1 exit gate: runs install.sh on a real Ubuntu 24.04 machine, installs Jellyfin and checks it
  # indexes and serves a test video.
  install-gate:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bash scripts/make-bundle.sh /tmp/bundle
      - run: cp test/vm/m1-gate-inner.sh /tmp/bundle/
      - name: Install the kit, install Jellyfin and play a test video
        run: sudo bash /tmp/bundle/m1-gate-inner.sh /tmp/bundle

  # M2 exit gate: installs the kit, then a browser sets up the dashboard and installs, stops, starts,
  # reads the logs of and removes Jellyfin, using only the dashboard.
  dashboard-gate:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bash scripts/make-bundle.sh /tmp/bundle
      - run: cp test/vm/m2-gate-inner.sh /tmp/bundle/
      - name: Install the kit and check the dashboard is up and locked down
        run: sudo bash /tmp/bundle/m2-gate-inner.sh install /tmp/bundle
      - name: Install a browser
        run: pnpm --filter @selfhost/web exec playwright install --with-deps chromium
      - name: Use the dashboard in a browser
        run: |
          export SETUP_CODE="$(cat /tmp/gate-setup-code)"
          export DASHBOARD_URL=http://127.0.0.1:8080
          pnpm --filter @selfhost/web exec playwright test -c playwright.gate.config.ts
      - name: Upload the browser trace if the gate failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-trace
          path: apps/web/test-results
      - name: Restart, reset password, uninstall
        run: sudo bash /tmp/bundle/m2-gate-inner.sh finish

  # M3 exit gate: installs the kit and runs the storage flow on a virtual disk (scsi_debug), including
  # a simulated unplug and replug. The reboot part of the gate needs a real VM, see PROGRESS.md.
  storage-gate:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The runner's kernel may not offer scsi_debug. Remove this line once the job is known to pass.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bash scripts/make-bundle.sh /tmp/bundle
      - run: cp test/vm/m3-gate-inner.sh test/vm/agent-call.mjs /tmp/bundle/
      - name: Prepare, mount, map, unmount and unplug a disk
        run: sudo bash /tmp/bundle/m3-gate-inner.sh run /tmp/bundle
