name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Agent bundle answers requests in dry-run mode
        run: |
          node apps/agent/dist/agent.cjs --dry-run --socket /tmp/agent.sock &
          sleep 1
          node test/vm/check-agent.mjs /tmp/agent.sock --dry-run
