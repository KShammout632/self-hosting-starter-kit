name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Release signing is checked the way the installer checks it
        run: bash test/release-signing.sh
      - name: Root scripts never write through a planted symlink
        run: bash test/root-writes.sh
      - name: Dashboard UI tests (API mocked in the browser)
        run: |
          pnpm --filter @selfhost/web exec playwright install --with-deps chromium
          pnpm --filter @selfhost/web e2e
      - name: Agent bundle answers requests in dry-run mode
        run: |
          node apps/agent/dist/agent.cjs --dry-run --socket /tmp/agent.sock &
          sleep 1
          node test/vm/check-agent.mjs /tmp/agent.sock --dry-run
      - name: selfhost command talks to the dry-run agent
        run: |
          node apps/agent/dist/agent.cjs --dry-run --socket /tmp/agent2.sock &
          sleep 1
          export SELFHOST_AGENT_SOCKET=/tmp/agent2.sock
          node deploy/selfhost-cli.mjs install jellyfin
          node deploy/selfhost-cli.mjs logs jellyfin --tail 5
          node deploy/selfhost-cli.mjs status

  # Runs on a real Ubuntu 24.04 machine with systemd and Docker, so it also covers the M0 exit gate.
  agent-gate:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the agent as a systemd service and check it
        run: |
          mkdir /tmp/gate
          cp apps/agent/dist/agent.cjs deploy/selfhost-agent.service test/vm/check-agent.mjs /tmp/gate/
          sudo bash test/vm/m0-gate-inner.sh /tmp/gate

  # M1 exit gate: runs install.sh on a real Ubuntu 24.04 machine, installs Jellyfin and checks it
  # indexes and serves a test video.
  install-gate:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bash scripts/make-bundle.sh /tmp/bundle
      - run: cp test/vm/m1-gate-inner.sh /tmp/bundle/
      - name: Install the kit, install Jellyfin and play a test video
        run: sudo bash /tmp/bundle/m1-gate-inner.sh /tmp/bundle

  # M2 exit gate: installs the kit, then a browser sets up the dashboard and installs, stops, starts,
  # reads the logs of and removes Jellyfin, using only the dashboard.
  dashboard-gate:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bash scripts/make-bundle.sh /tmp/bundle
      - run: cp test/vm/m2-gate-inner.sh /tmp/bundle/
      - name: Install the kit and check the dashboard is up and locked down
        run: sudo bash /tmp/bundle/m2-gate-inner.sh install /tmp/bundle
      - name: Install a browser
        run: pnpm --filter @selfhost/web exec playwright install --with-deps chromium
      - name: Use the dashboard in a browser
        run: |
          export SETUP_CODE="$(cat /tmp/gate-setup-code)"
          export DASHBOARD_URL=http://127.0.0.1:8080
          pnpm --filter @selfhost/web exec playwright test -c playwright.gate.config.ts
      - name: Upload the browser trace if the gate failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-trace
          path: apps/web/test-results
      - name: Restart, reset password, uninstall
        run: sudo bash /tmp/bundle/m2-gate-inner.sh finish

  # M3 exit gate: installs the kit and runs the storage flow on a virtual disk (scsi_debug), including
  # a simulated unplug and replug. The reboot part of the gate needs a real VM, see PROGRESS.md.
  storage-gate:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bash scripts/make-bundle.sh /tmp/bundle
      - run: cp test/vm/m3-gate-inner.sh test/vm/agent-call.mjs /tmp/bundle/
      - name: Prepare, mount, map, unmount and unplug a disk
        run: sudo bash /tmp/bundle/m3-gate-inner.sh run /tmp/bundle

  # M4a gate: installs the kit, then Navidrome, Immich and Nextcloud, and checks each does real work
  # (finds a song, stores a photo, accepts a file) with generated secrets kept private.
  services-gate:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bash scripts/make-bundle.sh /tmp/bundle
      - run: cp test/vm/m4a-gate-inner.sh test/vm/agent-call.mjs /tmp/bundle/
      - name: Install Navidrome, Immich and Nextcloud and use them
        run: sudo bash /tmp/bundle/m4a-gate-inner.sh /tmp/bundle

  # M5a gate: moves Navidrome from an older release to the pinned one (account kept, private saved
  # copy made, only the newest three kept), then makes an Immich update look unhealthy and checks the
  # agent puts the old version and its database back.
  update-gate:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bash scripts/make-bundle.sh /tmp/bundle
      - run: cp test/vm/m5a-gate-inner.sh test/vm/agent-call.mjs /tmp/bundle/
      - name: Update a service, then roll one back
        run: sudo bash /tmp/bundle/m5a-gate-inner.sh /tmp/bundle

  # M5b gate: a kit update from one release to the next, served from this machine. Both builds use
  # SELFHOST_TEST_BUILD=1, the only way the agent accepts a release address on loopback.
  kit-update-gate:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the old version
        run: |
          SELFHOST_TEST_BUILD=1 pnpm build
          bash scripts/make-bundle.sh /tmp/old
          cp test/vm/m5b-gate-inner.sh test/vm/agent-call.mjs /tmp/old/
      - name: Build and package the new version
        run: |
          OLD="$(node -p 'require("./apps/agent/package.json").version')"
          NEW="$(node -p 'const [a, b, c] = process.argv[1].split("."); `${a}.${b}.${Number(c) + 10}`' "$OLD")"
          sed -i "s/\"version\": \"$OLD\"/\"version\": \"$NEW\"/" apps/agent/package.json
          sed -i "s/^KIT_VERSION=\"$OLD\"/KIT_VERSION=\"$NEW\"/" install.sh
          SELFHOST_TEST_BUILD=1 pnpm build
          openssl genpkey -algorithm ed25519 -out /tmp/test-release-key.pem
          SELFHOST_PACKAGE_TEST_BUILD=1 SELFHOST_SIGNING_KEY_FILE=/tmp/test-release-key.pem \
            bash scripts/package-release.sh "$NEW" "/tmp/serve/v$NEW"
          echo "NEW_VERSION=$NEW" >> "$GITHUB_ENV"
      - name: Update the kit, refuse bad downloads and roll back a broken release
        run: sudo bash /tmp/old/m5b-gate-inner.sh /tmp/old /tmp/serve "$NEW_VERSION" /tmp/test-release-key.pem

  # M4b gate: the Tailscale actions. The sign-in checks need only internet access. The tailnet checks
  # (publish addresses, fetch them over https, Nextcloud trusted domains) run when the repository has
  # a TS_AUTHKEY secret: an ephemeral, reusable auth key from a throwaway tailnet with MagicDNS and
  # HTTPS certificates turned on. Pull requests from forks do not get secrets, so they skip that part.
  tailscale-gate:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bash scripts/make-bundle.sh /tmp/bundle
      - run: cp test/vm/m4b-gate-inner.sh test/vm/agent-call.mjs /tmp/bundle/
      - name: Sign in, publish addresses and open them over https
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: sudo --preserve-env=TS_AUTHKEY,GITHUB_RUN_ID bash /tmp/bundle/m4b-gate-inner.sh /tmp/bundle
